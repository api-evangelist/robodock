name: RoboDock
description: >-
  RoboDock is an autonomous robotics company (Y Combinator W2026) building the
  robotics layer that powers autonomous EV and AV depots, starting with charging
  and inspections. Its robots automate depot operations for electric and
  autonomous vehicle fleets, handling vision-guided plug insertion with verified
  connection, automated post-trip vehicle inspection, and closed-loop learning
  that improves efficiency with each charge event. The company targets live EV
  and AV depots, ports, and logistics yards where charging and core depot
  operations are still performed manually multiple times per day across mixed
  fleets. RoboDock is a hardware and robotics business rather than an API
  provider; as of this profile it publishes no public developer API, SDK, or
  technical documentation. Founded by Zinny Weli (CEO, ex-Zipline and Amazon
  robotics) and Celine Wang (CTO, ex-Plus autonomous systems).
